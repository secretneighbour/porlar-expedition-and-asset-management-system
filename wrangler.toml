name = "porlar-expedition-and-asset-management-system"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws"]

[durable_objects]
bindings = [
  { name = "POLAR_DO", class_name = "PolarStateDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PolarStateDurableObject"]
